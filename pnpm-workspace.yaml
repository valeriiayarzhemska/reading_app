packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false # install analytics only, not needed
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - expo-dev-client@57.0.20
  - expo-dev-launcher@57.0.21
  - expo-dev-menu@57.0.20
