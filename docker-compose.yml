# Local development database. Credentials here are for local use only.
services:
  db:
    image: postgres:18-alpine
    container_name: reading-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reading
      POSTGRES_PASSWORD: reading
      POSTGRES_DB: reading
    ports:
      - '5433:5432' # 5432 on the host is taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reading -d reading']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
